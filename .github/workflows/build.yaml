name: UI-tests

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: maven
      - name: Start selenoid
        uses: Xotabu4/selenoid-github-action@v2
      - name: Build with Maven
        run: mvn clean test

      - name: Generate and publish Allure report
        uses: andrcuns/allure-report-action@v2
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages